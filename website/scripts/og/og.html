<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,500;9..40,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #ECE9FB; color: #1E1B3A; font-family: "DM Sans", system-ui, sans-serif; position: relative; }
  .blob { position: absolute; border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%; box-shadow: inset 0 -18px 30px rgba(0,0,0,.09), inset 0 18px 30px rgba(255,255,255,.55); }
  .b1 { width: 300px; height: 280px; background: #DDD4FE; right: -90px; top: -90px; }
  .b2 { width: 210px; height: 200px; background: #D2F4E6; left: -80px; bottom: -70px; }
  .b3 { width: 120px; height: 120px; background: #FFE3D2; left: 470px; top: -50px; border-radius: 50%; }
  .clay { background: #F7F5FF; box-shadow: 0 16px 34px rgba(92,72,190,.2), 0 3px 8px rgba(92,72,190,.1), inset 0 -8px 13px rgba(98,80,190,.16), inset 0 8px 13px rgba(255,255,255,.95); }
  .violet { color: #fff; background: linear-gradient(180deg, #9478FF, #6A4BEA); box-shadow: 0 12px 22px rgba(106,75,234,.38), inset 0 -6px 10px rgba(50,26,150,.45), inset 0 6px 10px rgba(255,255,255,.42); }
  .wrap { position: absolute; inset: 0; padding: 44px 60px 92px; display: grid; grid-template-columns: 1.02fr 1fr; gap: 44px; align-items: center; }
  .left { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .logo { display: flex; align-items: center; gap: 14px; font: 700 30px "Outfit", sans-serif; }
  .logo i { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; }
  h1 { font: 800 70px/1.02 "Outfit", sans-serif; letter-spacing: -2.4px; }
  h1 em { font-style: normal; color: #5B3FD9; }
  .lede { font-size: 23px; line-height: 1.38; color: #5F5A82; font-weight: 500; }
  .cmd { align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 13px 22px; border-radius: 18px; font: 500 21px "JetBrains Mono", monospace; background: #EFEBFD; box-shadow: inset 0 5px 10px rgba(98,80,190,.18), inset 0 -4px 8px rgba(255,255,255,.95); }
  .cmd b { color: #5B3FD9; font-weight: 500; }
  .right { position: relative; min-width: 0; }
  .player { border-radius: 34px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .screen { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 9; background: #2A2550; }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 4px 2px; }
  .play { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .track { flex: 1; height: 14px; border-radius: 999px; background: #EFEBFD; box-shadow: inset 0 4px 8px rgba(98,80,190,.2); position: relative; }
  .track i { position: absolute; inset: 0 62% 0 0; border-radius: 999px; background: linear-gradient(90deg, #9478FF, #6A4BEA); }
  .time { font: 500 16px "JetBrains Mono", monospace; color: #5F5A82; }
  .chip { position: absolute; display: flex; align-items: center; gap: 9px; padding: 11px 17px; border-radius: 18px; font: 600 18px "DM Sans", sans-serif; }
  .chip i { width: 26px; height: 26px; border-radius: 9px; box-shadow: inset 0 -3px 5px rgba(0,0,0,.14), inset 0 3px 5px rgba(255,255,255,.6); }
  .c1 { left: -26px; top: 26px; } .c2 { right: 34px; top: -24px; } .c3 { left: 70px; bottom: -34px; }
  .by { position: absolute; left: 60px; bottom: 30px; display: flex; align-items: center; gap: 10px; font-size: 18px; color: #5F5A82; }
  .by img { width: 30px; height: 30px; }
  .by b { font: 700 18px "Outfit", sans-serif; color: #1E1B3A; }
</style>
