<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tideline: a made-up shipment tracker</title>
<!-- A tiny fictional app, so the example video renders with nothing else running.
     Every company and number in it is invented. -->
<style>
  :root { --ink: #10243f; --line: #dbe3ee; --muted: #63738a; --paper: #f5f7fb; --late: #b42318; --ok: #1f7a45; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  header { display: flex; align-items: center; gap: 28px; padding: 16px 32px; background: #fff; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  nav { display: flex; gap: 6px; }
  nav button { font: inherit; font-weight: 600; color: var(--muted); background: none; border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  nav button.on { color: var(--ink); background: var(--paper); }
  main { padding: 28px 32px; max-width: 1180px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin-bottom: 22px; }
  .stats { display: flex; gap: 14px; margin-bottom: 22px; }
  .stat { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
  .stat b { display: block; font-size: 28px; letter-spacing: -.02em; }
  .stat span { color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .chip { font: inherit; font-weight: 600; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 16px; background: #fafbfd; }
  td { padding: 13px 16px; border-top: 1px solid var(--line); }
  td.id { font-family: Consolas, monospace; font-weight: 700; cursor: pointer; color: #1d4ed8; }
  .was { display: block; font-size: 12px; color: #b45309; font-style: italic; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .pill.late { background: #fde8e8; color: var(--late); }
  .pill.ok { background: #dff3e6; color: var(--ok); }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; background: #fff; border-left: 1px solid var(--line);
    box-shadow: -18px 0 50px rgba(16,36,63,.14); padding: 26px 28px; transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  #drawer.open { transform: none; }
  #drawer h2 { margin: 0 0 4px; font-size: 20px; }
  #drawer .close { position: absolute; top: 18px; right: 20px; font: inherit; border: 0; background: none; cursor: pointer; font-size: 18px; }
  #drawer li { margin: 10px 0; }
  .bars { display: flex; align-items: flex-end; gap: 18px; height: 260px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; }
  .bar { flex: 1; background: #9db7e0; border-radius: 8px 8px 0 0; position: relative; }
  .bar.low { background: #e6a1a1; }
  .bar span { position: absolute; left: 0; right: 0; bottom: -26px; text-align: center; font-size: 12px; color: var(--muted); }
  .bar b { position: absolute; left: 0; right: 0; top: -24px; text-align: center; font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Tideline</div>
    <nav>
      <button data-tab="shipments" class="on">Shipments</button>
      <button data-tab="ontime">On-time</button>
    </nav>
  </header>
  <main id="view"></main>
  <aside id="drawer">
    <button class="close" aria-label="Close">✕</button>
    <h2>Shipment <span id="d-id"></span></h2>
    <div class="sub">Every change to its delivery date</div>
    <ul id="d-log"></ul>
  </aside>
</div>
<script>
  const ROWS = [
    { id: 'TL-4812', to: 'Port Aldous', eta: '14 Mar', was: '9 Mar', qty: 240, late: true },
    { id: 'TL-4790', to: 'Kessel Yard', eta: '11 Mar', qty: 96 },
    { id: 'TL-4777', to: 'Port Aldous', eta: '18 Mar', was: '12 Mar', qty: 410, late: true },
    { id: 'TL-4761', to: 'Marrow Quay', eta: '10 Mar', qty: 58 },
    { id: 'TL-4733', to: 'Kessel Yard', eta: '21 Mar', was: '20 Mar', qty: 132 },
    { id: 'TL-4729', to: 'Marrow Quay', eta: '12 Mar', qty: 305 },
  ]
  const view = document.getElementById('view')
  let movedOnly = false
  function shipments() {
    const rows = ROWS.filter((r) => !movedOnly || r.was)
    view.innerHTML = `
      <h1>Shipments</h1><div class="sub">Open shipments, as of this morning's file</div>
      <div class="stats">
        <div class="stat"><b>${ROWS.length}</b><span>open shipments</span></div>
        <div class="stat" id="moved-stat"><b>${ROWS.filter((r) => r.was).length}</b><span>dates moved since yesterday</span></div>
        <div class="stat"><b>${ROWS.filter((r) => r.late).length}</b><span>now late</span></div>
      </div>
      <div class="toolbar"><button class="chip ${movedOnly ? 'on' : ''}" id="moved-only">Moved only</button></div>
      <table><thead><tr><th>Shipment</th><th>To</th><th>Delivery date</th><th>Qty</th><th>Status</th></tr></thead><tbody>
      ${rows.map((r) => `<tr>
        <td class="id" data-id="${r.id}">${r.id}</td><td>${r.to}</td>
        <td class="eta"><b>${r.eta}</b>${r.was ? `<span class="was">was ${r.was}</span>` : ''}</td>
        <td>${r.qty}</td>
        <td><span class="pill ${r.late ? 'late' : 'ok'}">${r.late ? 'Late' : 'On time'}</span></td></tr>`).join('')}
      </tbody></table>`
  }
  function ontime() {
    const months = [['Nov', 91], ['Dec', 88], ['Jan', 93], ['Feb', 74], ['Mar', 86]]
    view.innerHTML = `<h1>On-time delivery</h1><div class="sub">Share of shipments delivered on or before the promised date</div>
      <div class="bars">${months.map(([m, v]) => `<div class="bar ${v < 80 ? 'low' : ''}" style="height:${v}%"><b>${v}%</b><span>${m}</span></div>`).join('')}</div>`
  }
  const TABS = { shipments, ontime }
  document.querySelector('nav').addEventListener('click', (e) => {
    const tab = e.target.dataset.tab
    if (!tab) return
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b === e.target))
    // a short fake load, so the example shows a dissolve hiding it
    view.innerHTML = '<div class="sub">Loading…</div>'
    setTimeout(TABS[tab], 600)
  })
  view.addEventListener('click', (e) => {
    if (e.target.id === 'moved-only') { movedOnly = !movedOnly; shipments() }
    const id = e.target.dataset.id
    if (!id) return
    const r = ROWS.find((x) => x.id === id)
    document.getElementById('d-id').textContent = id
    document.getElementById('d-log').innerHTML = [
      `<li><b>2 Mar</b> first seen, delivery ${r.was || r.eta}</li>`,
      r.was ? `<li><b>8 Mar</b> delivery moved from ${r.was} to ${r.eta}</li>` : '',
    ].join('')
    document.getElementById('drawer').classList.add('open')
  })
  document.querySelector('#drawer .close').addEventListener('click', () => document.getElementById('drawer').classList.remove('open'))
  shipments()
</script>
</body>
</html>
